name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Regression tests
        run: ./Scripts/test.sh
      - name: XCTest suite
        run: swift test
      - name: Build and verify app
        run: ./Scripts/package_app.sh release
      - name: Check shell syntax
        run: bash -n Scripts/*.sh install.sh
