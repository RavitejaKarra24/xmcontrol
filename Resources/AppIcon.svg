<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Canvas: the app's near-black with a cool lift toward the top -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a2a"/>
      <stop offset="1" stop-color="#06080d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#0a85ff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#0a85ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0a85ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <!-- Accent: XMTheme.accentBright → accent → accentDeep -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66ccff"/>
      <stop offset="0.5" stop-color="#0a85ff"/>
      <stop offset="1" stop-color="#005cdb"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc2ff"/>
      <stop offset="1" stop-color="#0057d1"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fdcff"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="580" r="300" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(512 580) scale(1 0.85) translate(-512 -580)">
      <stop offset="0" stop-color="#0a85ff" stop-opacity="0.40"/>
      <stop offset="0.45" stop-color="#0a85ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0a85ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- Tile -->
  <rect x="100" y="112" width="824" height="824" rx="185" fill="#000" opacity="0.45" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- Halo behind the headphones -->
    <rect x="100" y="100" width="824" height="824" fill="url(#halo)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- Headband -->
  <path d="M 322 600 L 322 548 A 190 190 0 0 1 702 548 L 702 600"
        fill="none" stroke="url(#accent)" stroke-width="46" stroke-linecap="round"/>
  <!-- Headband highlight -->
  <path d="M 352 470 A 190 190 0 0 1 512 380"
        fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>

  <!-- Ear cups -->
  <rect x="268" y="530" width="112" height="218" rx="56" fill="url(#cup)"/>
  <rect x="644" y="530" width="112" height="218" rx="56" fill="url(#cup)"/>
  <!-- Cushions (inner faces) -->
  <rect x="352" y="556" width="40" height="166" rx="20" fill="#0b1324"/>
  <rect x="632" y="556" width="40" height="166" rx="20" fill="#0b1324"/>
  <!-- Cup highlights -->
  <rect x="290" y="556" width="12" height="96" rx="6" fill="#ffffff" opacity="0.35"/>
  <rect x="666" y="556" width="12" height="96" rx="6" fill="#ffffff" opacity="0.35"/>

  <!-- Equalizer between the cups -->
  <g fill="url(#bars)">
    <rect x="436" y="609" width="20" height="60"  rx="10"/>
    <rect x="468" y="574" width="20" height="130" rx="10"/>
    <rect x="502" y="544" width="20" height="190" rx="10"/>
    <rect x="536" y="584" width="20" height="110" rx="10"/>
    <rect x="568" y="614" width="20" height="50"  rx="10"/>
  </g>
</svg>
